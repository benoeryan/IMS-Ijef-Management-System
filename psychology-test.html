<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>IJEF Psychological Test — LPK IJEF Corp</title>
<meta name="theme-color" content="#1a237e">
<link rel="icon" type="image/png" href="assets/logo-ijef.png">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#1a237e;--primary-light:#283593;--primary-dark:#0d1642;--accent:#ff6f00;--success:#2e7d32;--danger:#c62828;--warning:#f57f17;--info:#0277bd;--bg:#f0f2f5;--card:#fff;--text:#212121;--text-light:#666;--border:#e0e0e0;--radius:10px}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;padding-bottom:40px}
.header-bar{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:18px 20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.container{max-width:850px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:20px;border:1px solid var(--border)}
.toast-container{position:fixed;top:70px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:8px;color:#fff;font-size:.85rem;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light)}
.btn-accent{background:var(--accent);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:#333}
.option-box{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all .2s;background:#fff}
.option-box:hover{border-color:var(--primary);background:#f8f9ff}
.option-box.selected{border-color:var(--primary);background:#e8eaf6;font-weight:600}
.q-num-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:20px}
@media(max-width:600px){.q-num-grid{grid-template-columns:repeat(5,1fr)}}
.q-num-btn{padding:8px 0;text-align:center;border:1px solid var(--border);border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer;background:#fff}
.q-num-btn.answered{background:#e8f5e9;border-color:#2e7d32;color:#2e7d32}
.q-num-btn.current{border-color:var(--primary);background:var(--primary);color:#fff}
</style>
</head>
<body>
<div class="header-bar">
  <h1 style="font-size:1.2rem;font-weight:700">🧩 IJEF Psychological Test</h1>
  <div style="font-size:.78rem;opacity:.85;margin-top:2px">LPK IJEF Corp — Tes Kemampuan Berpikir & Logika Psikotes</div>
</div>

<div class="toast-container" id="toastContainer"></div>
<div id="app" class="container"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="psychology-test.js?v=1.0"></script>
</body>
</html>
